<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VOIDLIGHT — keep the last lantern burning</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="VOIDLIGHT: fly the lantern-ship with WASD or arrows, aim with the mouse, hold click or Space to fire, Shift to dash. Shoot the shades, gather their embers, survive the waves."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
